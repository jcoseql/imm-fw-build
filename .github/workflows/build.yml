name: Build 25.12.x Rockchip (自建 IB · dae 固化版)

# ============================================================
# 自建 ImageBuilder 固化构建 —— 不依赖任何第三方构建脚本
#   官方组件: immortalwrt/imagebuilder:rockchip-armv8-openwrt-<ver> + 官方 feed
#   烘入: dae main@e3fee8fb (本仓库 Releases, sha256 锁定) + geo + procd init
#         + Tailscale 官方静态 v1.102.4 (pkgs.tailscale.com, sha256 锁定)
#   固定: XDP 全量工具面 (ip-full/bpftool/xdp-tools) + /root/xdp 试装件 (CI 现编 .o)
#   可选: enable_docker=yes → docker/dockerd/compose + kmod-br-netfilter (依赖自动解析)
#   首启: files/etc/uci-defaults/99-custom.sh —— 仅设管理 IP, 不放开 WAN 入站
#   自检: manifest 断言 + 解包比对烘入件 sha256 + XDP 试装件 (scripts/selfcheck.sh)
#   仅手动触发 (workflow_dispatch)
# ============================================================

run-name: 固化构建 · ${{ inputs.profile }} · ${{ inputs.luci_version }}

on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "ImmortalWrt 版本 (= builder 镜像 tag)"
        required: true
        type: choice
        default: "25.12.2"
        options:
          - 25.12.2
          - 25.12.1
          - 25.12.0
      profile:
        description: "设备型号 (默认 E52C)"
        required: true
        type: choice
        default: "radxa_e52c"
        options:
          - linkease_easepi-r1
          - 9tripod_x3568-v4
          - ariaboard_photonicat
          - ariaboard_photonicat2
          - armsom_sige3
          - armsom_sige7
          - cyber_cyber3588-aib
          - ezpro_mrkaio-m68s
          - firefly_roc-rk3328-cc
          - firefly_roc-rk3568-pc
          - friendlyarm_nanopc-t4
          - friendlyarm_nanopc-t6
          - friendlyarm_nanopi-r2c
          - friendlyarm_nanopi-r2c-plus
          - friendlyarm_nanopi-r2s
          - friendlyarm_nanopi-r3s
          - friendlyarm_nanopi-r4s
          - friendlyarm_nanopi-r4se
          - friendlyarm_nanopi-r4s-enterprise
          - friendlyarm_nanopi-r5c
          - friendlyarm_nanopi-r5s
          - friendlyarm_nanopi-r6c
          - friendlyarm_nanopi-r6s
          - friendlyarm_nanopi-r76s
          - huake_guangmiao-g4c
          - lunzn_fastrhino-r66s
          - lunzn_fastrhino-r68s
          - lyt_t68m
          - mmbox_anas3035
          - nlnet_xiguapi-v3
          - pine64_rock64
          - pine64_rockpro64
          - radxa_cm3_io
          - radxa_e20c
          - radxa_e25
          - radxa_e52c
          - radxa_rock-2a
          - radxa_rock-2f
          - radxa_rock-3a
          - radxa_rock-3b
          - radxa_rock-3c
          - radxa_rock-4c-plus
          - radxa_rock-4d
          - radxa_rock-4se
          - radxa_rock-5a
          - radxa_rock-5b
          - radxa_rock-5b-plus
          - radxa_rock-5-itx
          - radxa_rock-5c
          - radxa_rock-5t
          - radxa_rock-pi-4a
          - radxa_rock-pi-e
          - radxa_rock-pi-s
          - radxa_zero-3e
          - radxa_zero-3w
          - sinovoip_bpi-r2-pro
          - widora_mangopi-m28c
          - widora_mangopi-m28k
          - xunlong_orangepi-5
          - xunlong_orangepi-5-plus
          - xunlong_orangepi-r1-plus
          - xunlong_orangepi-r1-plus-lts
      custom_router_ip:
        description: "管理地址 (LAN, 如 192.168.12.1)"
        required: true
        default: "192.168.101.1"
      rootfs_partsize:
        description: "软件包空间大小"
        required: true
        type: choice
        default: "2G"
        options:
          - "1G"
          - "2G"
          - "3G"
          - "4G"
      enable_docker:
        description: "集成 Docker"
        required: true
        type: choice
        default: "no"
        options:
          - "no"
          - "yes"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Stage files/ (管理IP + dae + geo + Tailscale)
        run: |
          set -euo pipefail
          mkdir -p files/etc/config files/usr/bin files/usr/sbin files/usr/local/share/dae files/etc/init.d files/etc/uci-defaults files/root/xdp
          # 管理 IP (供首启脚本读取)
          echo "${{ inputs.custom_router_ip }}" > files/etc/config/custom_router_ip.txt
          # dae main@e3fee8fb (2026-10-02 Daily Build; 本仓库 Releases 托管; 换版: 改 URL + sha 两行)
          curl -fsSL -o /tmp/dae https://github.com/jcoseql/imm-fw-build/releases/download/dae-bin-e3fee8fb/dae-linux-arm64-e3fee8fb
          echo "cc6c18d47bb9c404fab864cadb983e188766a5187ec706ab6a7fb88257f14d59  /tmp/dae" | sha256sum -c
          install -m 0755 /tmp/dae files/usr/bin/dae
          # geo 数据 (Loyalsoldier latest)
          curl -fsSL -o files/usr/local/share/dae/geoip.dat  https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          curl -fsSL -o files/usr/local/share/dae/geosite.dat https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat
          # Tailscale 官方静态二进制 (pkgs.tailscale.com; 换版: 改 URL + 3 处 sha)
          curl -fsSL -o /tmp/ts.tgz https://pkgs.tailscale.com/stable/tailscale_1.102.4_arm64.tgz
          echo "9dd1e6a592a014bbaea0103167ffe299adeda4ba14e078ce9c2895364f6c4c3f  /tmp/ts.tgz" | sha256sum -c
          tar xzf /tmp/ts.tgz -C /tmp
          echo "93c3558f592200133b377dd9f96eac9b278b9057f7ae6b8656b15f4fa05506d0  /tmp/tailscale_1.102.4_arm64/tailscale" | sha256sum -c
          echo "1ff5174fcbf3abbff85eacc73e6e548b0d094d913a48c1369f60811d1e92eeef  /tmp/tailscale_1.102.4_arm64/tailscaled" | sha256sum -c
          install -m 0755 /tmp/tailscale_1.102.4_arm64/tailscale  files/usr/sbin/tailscale
          install -m 0755 /tmp/tailscale_1.102.4_arm64/tailscaled files/usr/sbin/tailscaled
          # 执行位 (仓库已带 755; 此处兜底)
          chmod 0755 files/etc/init.d/dae files/etc/uci-defaults/99-custom.sh
          echo "== files/ 清单 =="
          find files -type f | sort

      - name: Compile XDP 试装件 (clang -target bpf)
        run: |
          set -euo pipefail
          if ! command -v clang >/dev/null 2>&1; then
            sudo apt-get -qq update && sudo apt-get -qq install -y clang
          fi
          clang --version | head -1
          clang -O2 -target bpf -c files/root/xdp/xdp_pass.c -o files/root/xdp/xdp_pass.o
          ls -la files/root/xdp/
          od -An -tx1 -N4 files/root/xdp/xdp_pass.o

      - name: Build (官方 ImageBuilder 容器)
        run: |
          case "${{ inputs.rootfs_partsize }}" in
            1G) ROOTFS_SIZE=1024 ;;
            2G) ROOTFS_SIZE=2048 ;;
            3G) ROOTFS_SIZE=3072 ;;
            4G) ROOTFS_SIZE=4096 ;;
          esac
          docker run --rm -i \
              --user root \
              -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
              -v "${{ github.workspace }}/files:/home/build/immortalwrt/files" \
              -v "${{ github.workspace }}/scripts/build.sh:/home/build/immortalwrt/build.sh" \
              -e PROFILE="${{ inputs.profile }}" \
              -e ROOTFS_PARTSIZE="$ROOTFS_SIZE" \
              -e ENABLE_DOCKER="${{ inputs.enable_docker }}" \
          immortalwrt/imagebuilder:rockchip-armv8-openwrt-${{ inputs.luci_version }} /bin/bash /home/build/immortalwrt/build.sh
          echo "== 产物 =="
          ls -la bin/targets/rockchip/armv8/

      - name: Self-check (manifest + 解包比对 + XDP)
        env:
          ENABLE_DOCKER: ${{ inputs.enable_docker }}
        run: bash scripts/selfcheck.sh

      - name: Create info
        run: |
          cat > "${{ github.workspace }}/router-info.md" <<EOF
          ## 📡 路由器后台信息

          - ✳️ **设备型号**: ${{ inputs.profile }}
          - 🏠 **管理地址**: ${{ inputs.custom_router_ip }}
          - 👤 **用户名**: root
          - 🔑 **密码**: 无 (刷机后请尽快设置)
          - 🧬 **dae**: main@e3fee8fb (10/02 Daily) 已烘入 (/usr/bin/dae + /etc/init.d/dae + geo; 刷后放 /etc/dae/config.dae (0640) 再 start)
          - 🧪 **XDP**: 全量工具面 + /root/xdp/ 试装件 (native/skb 两种挂法; 用法见机内 /root/xdp/README-xdp.txt)
          - 🐳 **Docker**: ${{ inputs.enable_docker }}
          - 🧦 **Tailscale**: 官方静态 v1.102.4 (/usr/sbin)
          - 🎨 **主题**: bootstrap (无 argon)
          - 🛡️ **首启**: 仅设管理 IP; WAN 入站默认拒绝
          EOF

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Autobuild
          name: ImmortWrt-Rockchip (imm-fw-build)
          body_path: ${{ github.workspace }}/router-info.md
          files: |
            ${{ github.workspace }}/bin/targets/rockchip/armv8/*.img.gz
            ${{ github.workspace }}/bin/targets/rockchip/armv8/sha256sums
            ${{ github.workspace }}/bin/targets/rockchip/armv8/*.manifest
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
